name: Publish forecast dashboard
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '55 21 * * 0-4' # 06:55 JST, after the morning sync
    - cron: '25 22 * * 0-4' # 07:25 JST, morning retry
    - cron: '55 7,8,12 * * 1-5' # 16:55, 17:55, 21:55 JST
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Fetch the published forecast and history
        run: python3 scripts/refresh.py _site
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
